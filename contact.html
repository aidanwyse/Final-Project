    <header>
  <h1>SAMMY'S BAR & GRILL</h1>

<nav>

<div class="content">

  <section id="hero" class="hero">
    <h2>Great Food • Cold Drinks • Good Times</h2>
  </section>
  <section id="contact">
  <h2>Contact Us</h2>

  <div class="contact-container">

    <!-- INFO -->
    <div class="contact-info">
      <h3>Visit Us</h3>
      <p>📍 Huntley, Illinois</p>
      <p>📞 (847) 669-9025</p>
      <p>🕒 Open Daily: 11AM – 2AM</p>
    </div>

    <!-- FORM -->
    <div class="contact-form">
      <h3>Send a Message</h3>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="4" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

  </div>

  <!-- MAP -->
  <div class="map">
    <iframe src="https://maps.google.com/maps?q=Huntley%20Illinois&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
  </div>

</section>
